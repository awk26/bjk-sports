{% extends "layout.html" %}
{% block title %}{{ 'Edit Sport' if sport else 'Add Sport' }}{% endblock %}
{% block page_content %}
<div class="container-fluid py-4 px-4">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <div>
                    <h4 class="fw-bold mb-1">{{ 'Edit Sport' if sport else 'Add Sport' }}</h4>
                    <p class="text-muted small mb-0">{{ 'Update this sport\'s name' if sport else 'Add a new sport to the master list' }}</p>
                </div>
                <a href="{{ url_for('superadmin.superadmin_sports') }}" class="btn btn-outline-secondary btn-sm rounded-pill px-3">
                    <i class="bi bi-arrow-left me-1"></i> Back
                </a>
            </div>

    {{ flashed() }}

            <div class="card border-0 shadow-sm rounded-4">
                <div class="card-body p-4">
                    <form method="POST">
                        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                        <div class="mb-4">
                            <label class="form-label small fw-medium">Sport Name</label>
                            <input type="text" class="form-control" name="name" value="{{ sport.name if sport else '' }}"
                                   placeholder="e.g. Basketball, Football, Swimming" required autofocus>
                        </div>
                        <div class="d-grid">
                            <button type="submit" class="btn btn-primary rounded-pill py-2 fw-medium">
                                <i class="bi bi-{{ 'check-lg' if sport else 'plus-lg' }} me-1"></i>
                                {{ 'Update Sport' if sport else 'Add Sport' }}
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
