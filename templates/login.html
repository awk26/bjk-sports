{% extends "base.html" %}
{% block title %}Login{% endblock %}
{% block content %}
<style nonce="{{ csp_nonce() }}">
    body {
        overflow: hidden !important;
        height: 100vh !important;
        margin: 0 !important;
        padding: 0 !important;
    }
    .brand-icon img {
        height: 60px !important;
        width: auto !important;
        max-width: 100% !important;
        object-fit: contain !important;
    }
</style>
<div class="container min-vh-100 d-flex align-items-center justify-content-center" style="overflow: hidden;">
    <div class="row justify-content-center w-100">
        <div class="col-md-5 col-lg-4">
            <div class="card shadow-lg border-0 rounded-4">
                <div class="card-body p-4">
                    <div class="text-center mb-3">
                        <div class="brand-icon mb-2">
                            <img src="{{ url_for('static', filename='image/JIA_1.png') }}" alt="Logo">
                        </div>
                        <h3 class="fw-bold text-primary mb-1">BJK SPORTS</h3>
                        <p class="text-muted small mb-0">Sign in to your account</p>
                    </div>

                    {{ flashed() }}

                    <form method="POST" action="{{ url_for('auth.login') }}">
                        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                        <div class="mb-3">
                            <label for="username" class="form-label small fw-medium">Username</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light"><i class="bi bi-person"></i></span>
                                <input type="text" class="form-control" id="username" name="username" placeholder="Enter your username" required autofocus>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="password" class="form-label small fw-medium">Password</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light"><i class="bi bi-lock"></i></span>
                                <input type="password" class="form-control" id="password" name="password" placeholder="Enter your password" required>
                            </div>
                        </div>

                        <div class="d-flex justify-content-between align-items-center mb-3">
                            <div class="form-check">
                                <input type="checkbox" class="form-check-input" id="remember">
                                <label class="form-check-label small" for="remember">Remember me</label>
                            </div>
                            <a href="{{ url_for('auth.forgot_password') }}" class="small text-decoration-none">Forgot password?</a>
                        </div>

                        <button type="submit" class="btn btn-primary w-100 py-2 fw-medium">
                            Sign In
                        </button>
                    </form>
                </div>
            </div>
            <p class="text-center text-muted small mt-3 mb-0">
                BJK Athletes Management System
            </p>
        </div>
    </div>
</div>
{% endblock %}
